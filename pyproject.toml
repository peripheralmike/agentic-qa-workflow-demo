[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "agentic-qa-workflow-demo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["mcp>=1.12,<2", "httpx>=0.28,<1", "pydantic>=2,<3"]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[project.scripts]
qa-demo = "qa_workflow.cli:main"
qa-mcp = "qa_workflow.server:main"
[tool.setuptools.packages.find]
include = ["qa_workflow*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
